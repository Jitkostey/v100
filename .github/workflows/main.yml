def db():
    con = sqlite3.connect(DB_FILE)
    con.execute("""
        CREATE TABLE IF NOT EXISTS history (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            created_at TEXT NOT NULL,
            direction TEXT NOT NULL,
            source TEXT NOT NULL,
            result TEXT NOT NULL
        )
    """)
    con.execute("""
        CREATE TABLE IF NOT EXISTS templates (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            title TEXT NOT NULL,
            body TEXT NOT NULL
        )
    """)
    count = con.execute("SELECT COUNT(*) FROM templates").fetchone()[0]
    if count == 0:
        con.executemany(
            "INSERT INTO templates(title,body) VALUES (?,?)",
            DEFAULT_TEMPLATES
        )
    con.commit()
    return con


class Signals(QObject):
    translate = Signal(str, int)
    status = Signal(str)
    result = Signal(str, str, str)


class GlobalHotkeys:
    WM_HOTKEY = 0x0312
    WM_QUIT = 0x0012
    MOD_CONTROL = 0x0002
    MOD_NOREPEAT = 0x4000
    VK_Q = 0x51
    VK_R = 0x52

    def __init__(self, callback):
        self.callback = callback
        self.thread = None
        self.native_thread_id = None
        self.running = False

    def start(self):
        if os.name != "nt":
            return
        self.running = True
        self.thread = threading.Thread(
            target=self._message_loop,
            daemon=True
        )
        self.thread.start()

    def _message_loop(self):
        user32 = ctypes.windll.user32
        kernel32 = ctypes.windll.kernel32

        self.native_thread_id = kernel32.GetCurrentThreadId()

        ok_q = bool(user32.RegisterHotKey(
            None, 1,
            self.MOD_CONTROL | self.MOD_NOREPEAT,
            self.VK_Q
        ))
        ok_r = bool(user32.RegisterHotKey(
            None, 2,
            self.MOD_CONTROL | self.MOD_NOREPEAT,
            self.VK_R
        ))

        if not (ok_q and ok_r):
            if ok_q:
                user32.UnregisterHotKey(None, 1)
            if ok_r:
                user32.UnregisterHotKey(None, 2)
            self.callback("hook_error", 0)
            return

        msg = wintypes.MSG()

        while self.running:
            result = user32.GetMessageW(
                ctypes.byref(msg), None, 0, 0
            )
            if result <= 0:
                break

            if msg.message == self.WM_HOTKEY:
                hwnd = int(user32.GetForegroundWindow() or 0)
                self.callback(
                    "to_ru" if msg.wParam == 1 else "to_en",
                    hwnd
                )

        user32.UnregisterHotKey(None, 1)
        user32.UnregisterHotKey(None, 2)

    def stop(self):
        self.running = False
        if os.name == "nt" and self.native_thread_id:
            ctypes.windll.user32.PostThreadMessageW(
                self.native_thread_id,
                self.WM_QUIT, 0, 0
            )


class Translator:
    def __init__(self, settings):
        self.settings = settings

    def translate(self, text, direction):
        api_key = self.settings.value("api_key", "").strip()

        if not api_key:
            raise RuntimeError(
                "Сначала добавь OpenAI API key во вкладке «Настройки»."
            )

        model = self.settings.value("model", "gpt-4.1-mini")
        target = "Russian" if direction == "to_ru" else "English"

        system = (
            f"Translate the user's text into {target}. "
            "Preserve meaning, tone, names, emojis, slang and chat context. "
            "For English output, write natural, fluent conversational English, "
            "not a literal translation. "
            "Return only the translation, without explanations or quotation marks. "
            "Do not add promises, services, or facts that are not in the source."
        )

        payload = {
            "model": model,
            "input": [
                {
                    "role": "system",
                    "content": [
                        {"type": "input_text", "text": system}
                    ]
                },
                {
                    "role": "user",
                    "content": [
                        {"type": "input_text", "text": text}
                    ]
                }
            ]
        }

        req = Request(
            "https://api.openai.com/v1/responses",
            data=json.dumps(payload).encode("utf-8"),
            headers={
                "Authorization": f"Bearer {api_key}",
                "Content-Type": "application/json"
            },
            method="POST"
        )

        try:
            with urlopen(req, timeout=45) as response:
                data = json.loads(
                    response.read().decode("utf-8")
                )
        except HTTPError as e:
            detail = e.read().decode(
                "utf-8", errors="replace"
            )
            raise RuntimeError(
                f"Ошибка API ({e.code}): {detail[:500]}"
            )
        except URLError as e:
            raise RuntimeError(f"Нет соединения с API: {e}")

        out = data.get("output_text")

        if not out:
            chunks = []
            for item in data.get("output", []):
                for content in item.get("content", []):
                    if content.get("type") == "output_text":
                        chunks.append(content.get("text", ""))
            out = "\n".join(chunks)

        if not out.strip():
            raise RuntimeError("API вернул пустой перевод.")

        return out.strip()


class FloatingPopup(QWidget):
    def __init__(self, parent=None):
        super().__init__(
            parent,
            Qt.Tool | Qt.FramelessWindowHint |
            Qt.WindowStaysOnTopHint
        )

        self.setAttribute(Qt.WA_ShowWithoutActivating, True)
        self.setObjectName("floatingPopup")
        self.setFixedWidth(390)
        self.pinned = False

        layout = QVBoxLayout(self)
        layout.setContentsMargins(14, 12, 14, 12)
        layout.setSpacing(8)

        top = QHBoxLayout()
        self.caption = QLabel("Adele Translator · Перевод")
        self.caption.setStyleSheet(
            "font-weight:700;color:#cbd5e1;"
        )
        top.addWidget(self.caption)
        top.addStretch(1)

        pin = QPushButton("📌")
        pin.setFixedWidth(30)
        pin.clicked.connect(self.toggle_pin)
        top.addWidget(pin)

        close = QPushButton("×")
        close.setFixedWidth(28)
        close.clicked.connect(self.hide)
        top.addWidget(close)

        layout.addLayout(top)

        self.source = QLabel()
        self.source.setWordWrap(True)
        self.source.setStyleSheet(
            "color:#94a3b8;font-size:11px;"
        )
        layout.addWidget(self.source)

        self.result = QLabel()
        self.result.setWordWrap(True)
        self.result.setTextInteractionFlags(
            Qt.TextSelectableByMouse
        )
        self.result.setStyleSheet(
            "color:#f8fafc;font-size:14px;font-weight:500;"
        )
        layout.addWidget(self.result)

        self.progress = QProgressBar()
        self.progress.setRange(0, 0)
        self.progress.setFixedHeight(5)
        self.progress.setTextVisible(False)
        self.progress.setStyleSheet(
            "QProgressBar{background:#293449;border:0;border-radius:2px;}"
            "QProgressBar::chunk{background:#63a7ff;border-radius:2px;}"
        )
        self.progress.hide()
        layout.addWidget(self.progress)

        row = QHBoxLayout()

        copy = QPushButton("Копировать")
        copy.clicked.connect(self.copy_result)
        row.addWidget(copy)

        self.replace_btn = QPushButton("Вставить в исходное поле")
        self.replace_btn.setToolTip(
            "Скопировать перевод; затем вставь его в чат через Ctrl+V"
        )
        self.replace_btn.clicked.connect(self.copy_result)
        row.addWidget(self.replace_btn)

        layout.addLayout(row)

        self.setStyleSheet(
            "#floatingPopup{background:#171c27;border:1px solid #39465c;border-radius:12px;}"
            "QPushButton{background:#293449;color:#f8fafc;border:0;border-radius:7px;padding:6px 9px;}"
            "QPushButton:hover{background:#3b4b65;}"
        )

        self.effect = QGraphicsOpacityEffect(self)
        self.setGraphicsEffect(self.effect)
        self.effect.setOpacity(0)

        self.anim = QPropertyAnimation(
            self.effect, b"opacity", self
        )
        self.anim.setDuration(180)
        self.anim.setStartValue(0)
        self.anim.setEndValue(1)
        self.anim.setEasingCurve(QEasingCurve.OutCubic)

        self._result_text = ""

        self.timer = QTimer(self)
        self.timer.setSingleShot(True)
        self.timer.timeout.connect(
            lambda: self.hide() if not self.pinned else None
        )

    def show_result(self, source, result):
        self.progress.hide()
        self._result_text = result
        self.source.setText(
            source[:180] + ("…" if len(source) > 180 else "")
        )
        self.result.setText(result)

        pos = QCursor.pos() + QPoint(16, 18)
        screen = (
            QGuiApplication.screenAt(pos)
            or QGuiApplication.primaryScreen()
        )
        area = screen.availableGeometry()

        if pos.x() + self.width() > area.right():
            pos.setX(max(area.left(), area.right() - self.width()))

        if pos.y() + 190 > area.bottom():
            pos.setY(max(area.top(), area.bottom() - 200))

        self.move(pos)
        self.show()
        self.raise_()
        self.effect.setOpacity(0)
        self.anim.start()
        self.timer.start(12000)

    def show_loading(self):
        self._result_text = ""
        self.progress.show()
        self.source.setText("Обрабатываю выделенный текст…")
        self.result.setText("Перевожу…")

        pos = QCursor.pos() + QPoint(16, 18)
        self.move(pos)
        self.show()
        self.raise_()
        self.effect.setOpacity(0)
        self.anim.start()
        self.timer.stop()

    def copy_result(self):
        if self._result_text:
            QApplication.clipboard().setText(
                self._result_text
            )

    def toggle_pin(self):
        self.pinned = not self.pinned
        if self.pinned:
            self.timer.stop()
        else:
            self.timer.start(12000)


