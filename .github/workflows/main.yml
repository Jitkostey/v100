название: Собрать Adele Translator для Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 mss Pillow pytesseract pyinstaller

      - name: Собрать EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "AdeleTranslator" main.py

      - name: Загрузить EXE
        uses: actions/upload-artifact@v4
        with:
          name: AdeleTranslator-Windows
          path: dist/AdeleTranslator.exe
