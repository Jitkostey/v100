            "AdeleTools", "AdeleTranslator"
        )

        self.signals = Signals()
        self.signals.translate.connect(self.handle_hotkey)
        self.signals.status.connect(self.show_status)
        self.signals.result.connect(self.show_translation)

        self.translator = Translator(self.settings)

        self._busy = False
        self._silent_replace_request = False
        self._last_clipboard = ""
        self._pending_hotkey = None
        self._suppress_clipboard_until = 0
        self._target_hwnd = 0
