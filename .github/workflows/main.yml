
name: Build Adele Translator for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 mss Pillow pytesseract pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AdeleTranslator trans/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AdeleTranslator-Windows
          path: dist/AdeleTranslator.exe
