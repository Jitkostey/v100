    def _setup_tray(self):
        self.tray = QSystemTrayIcon(self)
        self.tray.setToolTip(APP_NAME)

        menu = QMenu()

        show_action = QAction("Открыть", self)
        show_action.triggered.connect(self.showNormal)

        quit_action = QAction("Выход", self)
        quit_action.triggered.connect(self.quit_app)

        menu.addAction(show_action)
        menu.addAction(quit_action)

        self.tray.setContextMenu(menu)
        self.tray.activated.connect(
            lambda reason:
            self.showNormal()
            if reason == QSystemTrayIcon.DoubleClick
            else None
        )

        if QSystemTrayIcon.isSystemTrayAvailable():
            self.tray.show()

    def show_status(self, msg):
        self.status_label.setText(msg)

    def toggle_topmost(self):
        enabled = (
            self.overlay_check.isChecked()
            if hasattr(self, "overlay_check")
            else True
        )
        self.setWindowFlag(
            Qt.WindowStaysOnTopHint, enabled
        )
        self.show()
        self.settings.setValue("always_on_top", enabled)

    def save_settings(self):
        self.settings.setValue(
            "api_key", self.api_key_edit.text().strip()
        )
        self.settings.setValue(
            "model",
            self.model_edit.text().strip() or "gpt-4.1-mini"
        )
        self.settings.setValue(
            "clip_auto", self.clip_auto.isChecked()
        )

        QMessageBox.information(
            self, "Сохранено",
            "Настройки сохранены локально."
        )

    def paste_clipboard(self):
        self.source_edit.setPlainText(
            QApplication.clipboard().text()
        )

    def check_clipboard(self):
        current = QApplication.clipboard().text()

        if time.monotonic() < self._suppress_clipboard_until:
            self._last_clipboard = current
            return

        if current != self._last_clipboard:
            self._last_clipboard = current

            if (
                self.clip_auto.isChecked()
                and current.strip()
                and len(current) < 12000
            ):
                self.source_edit.setPlainText(current)
                self.start_translation(
                    self.direction.currentData(),
                    current
                )

    @staticmethod
    def _send_ctrl_key(vk):
        user32 = ctypes.windll.user32
        KEYEVENTF_KEYUP = 0x0002

        user32.keybd_event(0x11, 0, 0, 0)
        user32.keybd_event(vk, 0, 0, 0)
        user32.keybd_event(
            vk, 0, KEYEVENTF_KEYUP, 0
        )
        user32.keybd_event(
            0x11, 0, KEYEVENTF_KEYUP, 0
        )

    def handle_hotkey(self, direction, target_hwnd):
        if direction == "hook_error":
            self.show_status(
                "Не удалось зарегистрировать Ctrl+Q / Ctrl+R. "
                "Возможно, сочетания заняты другой программой."
            )
            return

        if self._busy:
            self.show_status(
                "Предыдущий перевод ещё выполняется. Дождись его завершения."
            )
            return

        if not target_hwnd:
            self.show_status(
                "Не удалось определить окно, в котором выделен текст."
            )
            return

        self._target_hwnd = int(target_hwnd)

        old_clipboard = QApplication.clipboard().text()
        self._pending_hotkey = (
            direction, old_clipboard, self._target_hwnd
        )

        QApplication.clipboard().setText("")
        self._last_clipboard = ""
        self._suppress_clipboard_until = (
            time.monotonic() + 1.5
        )

        QTimer.singleShot(
            100, self._request_selection_copy
        )

    def _request_selection_copy(self):
        if not self._pending_hotkey:
            return

        _, _, target_hwnd = self._pending_hotkey

        if (
            int(ctypes.windll.user32.GetForegroundWindow() or 0)
            != int(target_hwnd)
        ):
            self._finish_selection_cancelled(
                "Активное окно сменилось до копирования. "
                "Повтори горячую клавишу."
            )
            return

        self._send_ctrl_key(0x43)
        QTimer.singleShot(
            250, self._finish_hotkey_copy
        )

    def _finish_hotkey_copy(self):
        if not self._pending_hotkey:
            return

        direction, old_clipboard, target_hwnd = (
            self._pending_hotkey
        )
        self._pending_hotkey = None

        copied = QApplication.clipboard().text()

        if not copied.strip():
            QApplication.clipboard().setText(old_clipboard)
            self._last_clipboard = old_clipboard
            self.show_status(
                "Не удалось получить выделение. "
                "Выдели текст мышью и повтори сочетание."
            )
            return

        QApplication.clipboard().setText(old_clipboard)
        self._last_clipboard = old_clipboard

        self.direction.setCurrentIndex(
            0 if direction == "to_ru" else 1
        )
        self.source_edit.setPlainText(copied)

        self.start_translation(
            direction,
            copied,
            popup=(direction == "to_ru"),
            target_hwnd=target_hwnd,
            silent_replace=(direction == "to_en")
        )

    def _finish_selection_cancelled(self, message):
        if not self._pending_hotkey:
            return

        _, old_clipboard, _ = self._pending_hotkey
        self._pending_hotkey = None

        QApplication.clipboard().setText(old_clipboard)
        self._last_clipboard = old_clipboard
        self.show_status(message)

    def translate_manual(self):
        text = self.source_edit.toPlainText().strip()
        if text:
            self.start_translation(
                self.direction.currentData(), text
            )

    def start_translation(
        self, direction, text, popup=False,
        target_hwnd=0, silent_replace=False
    ):
        if self._busy:
            self.show_status(
                "Предыдущий перевод ещё выполняется…"
            )
            return

        self._busy = True
        self._popup_request = popup
        self._silent_replace_request = bool(silent_replace)
        self._target_hwnd = int(target_hwnd or 0)

        self.translate_button.setEnabled(False)
        self.show_status("Перевожу…")

        if popup:
            self.popup.show_loading()

        def work():
            try:
                result = self.translator.translate(
                    text, direction
                )
                self.signals.result.emit(
                    text, result, direction
                )
            except Exception as e:
                self.signals.status.emit(str(e))
                self.signals.result.emit(
                    text, "", direction
                )

        threading.Thread(
            target=work, daemon=True
        ).start()

    def show_translation(self, source, result, direction):
        self._busy = False
        self.translate_button.setEnabled(True)

        silent_replace = self._silent_replace_request
        self._silent_replace_request = False

        if not result:
            self.popup.hide()

            if (
                silent_replace
                and hasattr(self, "tray")
                and self.tray.isVisible()
            ):
                self.tray.showMessage(
                    APP_NAME,
                    "Перевод не выполнен. Исходный текст не изменён.",
                    QSystemTrayIcon.Warning,
                    4500
                )
            return

        if not silent_replace:
            self.result_edit.setPlainText(result)

        if self._popup_request:
            self.popup.show_result(source, result)

        elif direction == "to_en" and self._target_hwnd:
            QApplication.clipboard().setText(result)
            self._last_clipboard = result
            self._suppress_clipboard_until = (
                time.monotonic() + 1.5
            )

            target = self._target_hwnd
            QTimer.singleShot(
                120,
                lambda hwnd=target:
                self._force_paste_into_target(hwnd)
            )

        elif self.copy_result_check.isChecked():
            QApplication.clipboard().setText(result)
            self._last_clipboard = result

        con = db()
        con.execute(
            "INSERT INTO history(created_at,direction,source,result) "
            "VALUES (?,?,?,?)",
            (
                datetime.now().isoformat(timespec="seconds"),
                direction,
                source,
                result
            )
        )
        con.commit()
        con.close()

        self._load_history()

        if self._popup_request:
            self.show_status(
                "Перевод готов — результат показан во всплывающем окне."
            )
        elif direction == "to_en" and self._target_hwnd:
            self.show_status(
                "Перевод готов — выполняю замену выделенного текста."
            )
        else:
            self.show_status(
                "Перевод готов."
                if not self.copy_result_check.isChecked()
                else "Готово — перевод скопирован в буфер обмена."
            )

    def _force_paste_into_target(self, target_hwnd):
        if os.name != "nt" or not target_hwnd:
            return

        user32 = ctypes.windll.user32
        kernel32 = ctypes.windll.kernel32
        hwnd = int(target_hwnd)

        if not user32.IsWindow(hwnd):
            self._notify_replace_failure(
                "Исходное окно уже закрыто. "
                "Перевод сохранён в буфере обмена."
            )
            return

        SW_RESTORE = 9
        user32.ShowWindow(hwnd, SW_RESTORE)

        current_thread = kernel32.GetCurrentThreadId()
        target_thread = user32.GetWindowThreadProcessId(
            hwnd, None
        )

        foreground = int(
            user32.GetForegroundWindow() or 0
        )

        foreground_thread = (
            user32.GetWindowThreadProcessId(
                foreground, None
            )
            if foreground else 0
        )

        attached = []

        try:
            for tid in {
                int(target_thread),
                int(foreground_thread)
            }:
                if tid and tid != current_thread:
                    if user32.AttachThreadInput(
                        current_thread, tid, True
                    ):
                        attached.append(tid)

            user32.BringWindowToTop(hwnd)
            user32.SetForegroundWindow(hwnd)
            user32.SetActiveWindow(hwnd)
            user32.SetFocus(hwnd)

        finally:
            for tid in attached:
                user32.AttachThreadInput(
                    current_thread, tid, False
                )

        if (
            int(user32.GetForegroundWindow() or 0)
            != hwnd
        ):
            user32.SetForegroundWindow(hwnd)

        if (
            int(user32.GetForegroundWindow() or 0)
            != hwnd
        ):
            self._notify_replace_failure(
                "Windows не разрешила вернуть исходное окно. "
                "Перевод оставлен в буфере обмена."
            )
            return

        self._send_ctrl_key(0x56)

        self.show_status(
            "Готово — выделенный текст заменён английским переводом."
        )

    def _notify_replace_failure(self, message):
        self.show_status(message)

        if (
            hasattr(self, "tray")
            and self.tray.isVisible()
        ):
            self.tray.showMessage(
                APP_NAME,
                message,
                QSystemTrayIcon.Warning,
                5000
            )

    def replace_selection(self):
        text = self.result_edit.toPlainText()

        if text:
            QApplication.clipboard().setText(text)
            self.show_status(
                "Перевод скопирован. "
                "Вставь его в исходный чат сочетанием Ctrl+V."
            )

    def _load_history(self):
        if not hasattr(self, "history_list"):
            return

        self.history_list.clear()

        con = db()
        rows = con.execute(
            "SELECT id,created_at,direction,source,result "
            "FROM history ORDER BY id DESC LIMIT 300"
        ).fetchall()
        con.close()

        for rid, dt, direction, source, result in rows:
            arrow = "→ RU" if direction == "to_ru" else "→ EN"

            item = QListWidgetItem(
                f"{dt}  {arrow}  "
                f"{source[:90].replace(chr(10), ' ')}"
            )
            item.setData(
                Qt.UserRole, (source, result)
            )
            self.history_list.addItem(item)

    def open_history_item(self, item):
        source, result = item.data(Qt.UserRole)
        self.source_edit.setPlainText(source)
        self.result_edit.setPlainText(result)

    def _load_templates(self):
        if not hasattr(self, "template_list"):
            return

        self.template_list.clear()

        con = db()
        rows = con.execute(
            "SELECT id,title,body FROM templates ORDER BY title"
        ).fetchall()
        con.close()

        for tid, title, body in rows:
            item = QListWidgetItem(title)
            item.setData(Qt.UserRole, body)
            self.template_list.addItem(item)

    def preview_template(self, item):
        self.template_preview.setPlainText(
            item.data(Qt.UserRole)
        )

    def copy_template(self, item):
        body = item.data(Qt.UserRole)

        self.template_preview.setPlainText(body)
        QApplication.clipboard().setText(body)

        self.show_status(
            "Фраза скопирована в буфер обмена."
        )

    def add_template(self):
        title = self.template_title.text().strip()
        body = self.template_body.toPlainText().strip()

        if not title or not body:
            QMessageBox.warning(
                self,
                "Не хватает данных",
                "Укажи название и текст шаблона."
            )
            return

        con = db()
        con.execute(
            "INSERT INTO templates(title,body) VALUES (?,?)",
            (title, body)
        )
        con.commit()
        con.close()

        self.template_title.clear()
        self.template_body.clear()
        self._load_templates()

    def run_ocr(self):
        try:
            import mss
            from PIL import Image
            import pytesseract

            with mss.mss() as sct:
                shot = sct.grab(sct.monitors[1])
                img = Image.frombytes(
                    "RGB", shot.size, shot.rgb
                )

            text = pytesseract.image_to_string(img)

            if not text.strip():
                QMessageBox.information(
                    self,
                    "OCR",
                    "Текст на экране не распознан."
                )
                return

            self.source_edit.setPlainText(text)
            self.direction.setCurrentIndex(0)
            self.start_translation("to_ru", text)

        except ImportError:
            QMessageBox.warning(
                self,
                "Нужны компоненты OCR",
                "Установи зависимости: pip install mss pillow pytesseract, "
                "а также Tesseract OCR для Windows."
            )

        except Exception as e:
            QMessageBox.warning(
                self, "Ошибка OCR", str(e)
            )

    def closeEvent(self, event):
        event.ignore()
        self.hide()

        if (
            hasattr(self, "tray")
            and self.tray.isVisible()
        ):
            self.tray.showMessage(
                APP_NAME,
                "Приложение продолжает работать в системном трее. "
                "Для выхода выбери «Выход»."
            )

    def quit_app(self):
        try:
            self.hotkeys.stop()
        except Exception:
            pass

        QApplication.quit()


def main():
    if os.name != "nt":
        print("Adele Translator is designed for Windows.")

    app = QApplication(sys.argv)
    app.setApplicationName(APP_NAME)
    app.setQuitOnLastWindowClosed(False)

    window = MainWindow()
    window.show()

    sys.exit(app.exec())


if __name__ == "__main__":
    main()
